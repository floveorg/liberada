<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>liberada.net — Perfil de usuario</title>
  <script>
    // Subdominios <user>.liberada.net → perfil agregador.
    // GitHub Pages sirve ESTE mismo repo en cualquier subdominio CNAMEado a
    // floveorg.github.io (o con un comodín *.liberada.net → floveorg.github.io).
    // Aquí detectamos el host y redirigimos al perfil del usuario. risa/ama/www
    // viven en otros repos y nunca llegan a esta página.
    (function () {
      var m = (location.hostname || '').match(/^([a-z0-9_-]+)\.liberada\.net$/i);
      if (!m) return;
      var sub = m[1].toLowerCase();
      if (sub === 'www') return;
      function go(url) { location.replace(url); }
      fetch('https://risa.liberada.net/usernames.json', { cache: 'force-cache' })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (users) {
          go(users[sub]
            ? 'https://liberada.net/usa/' + encodeURIComponent(sub) + '/'
            : 'https://liberada.net');
        })
        .catch(function () {
          // Sin red: probamos el perfil igualmente (si no existe, la página lo dirá).
          go('https://liberada.net/usa/' + encodeURIComponent(sub) + '/');
        });
    })();
  </script>
  <style>
    :root {
      --ink: #2a1810;
      --paper: #faf6f1;
      --marigold: #ffb020;
      --magenta: #e63946;
      --sage: #a8d5ba;
      --sky: #89c4e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .container {
      max-width: 600px;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 32px;
    }
    .apps {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .app-card {
      display: block;
      width: 160px;
      padding: 24px 16px;
      background: #fff;
      border: 2px solid var(--ink);
      text-decoration: none;
      color: var(--ink);
      box-shadow: 4px 4px 0 rgba(42,24,16,.15);
      transition: transform .15s;
    }
    .app-card:hover {
      transform: translateY(-2px);
    }
    .app-emoji {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    .app-name {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .app-desc {
      font-size: .8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>liberada.net</h1>
    <p class="subtitle">Apps de la comunidad liberada</p>
    <div class="apps">
      <a class="app-card" href="https://risa.liberada.net">
        <div class="app-emoji">😹</div>
        <div class="app-name">Risa</div>
        <div class="app-desc">Risas de la comunidad</div>
      </a>
      <a class="app-card" href="https://lovy.liberada.net" style="opacity:.5; pointer-events:none;">
        <div class="app-emoji">💗</div>
        <div class="app-name">Lovy</div>
        <div class="app-desc">Próximamente</div>
      </a>
    </div>
  </div>
</body>
</html>
